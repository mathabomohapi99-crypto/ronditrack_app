name: ronditrack
description: "RondiTrack mobile app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.13.5 <4.0.0'

dependencies:
  cupertino_icons: 1.0.8
  dio: 5.11.1
  drift: 2.35.3
  drift_flutter: 0.3.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: 3.4.3
  flutter_secure_storage: 11.2.0
  freezed_annotation: 3.1.0
  go_router: 18.1.1
  intl: ^0.20.3
  json_annotation: 4.12.0
  retrofit: 4.10.0
  riverpod_annotation: 4.0.7
  shared_preferences: 2.5.6
  uuid: 4.6.0

dev_dependencies:
  build_runner: 2.16.2
  drift_dev: 2.35.2
  flutter_test:
    sdk: flutter
  freezed: 4.0.3
  go_router_builder: 4.5.2
  json_serializable: 6.15.2
  retrofit_generator: 10.3.3
  riverpod_generator: 4.0.9
  riverpod_lint: 3.1.9
  swagger_parser: 1.45.1
  very_good_analysis: 11.0.0

flutter:
  uses-material-design: true
  generate: true

dependency_overrides:
  cli_util: 0.6.0 # remove after 2026-12-04
  jni: 1.1.2 # remove after 2026-12-03
  jni_flutter: 1.0.4+1 # remove after 2026-12-03
  shared_preferences_android: 2.5.4 # remove after 2026-11-25
